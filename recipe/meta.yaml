{% set name = "skore" %}
{% set version = "0.24.1" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/skore-{{ version }}.tar.gz
  sha256: e1b510651df61249faf2301b4cb95fd040be70e2655fdffa85424e02621dd5e6

build:
  entry_points:
    # login
    - skore.plugins.login.hub = skore._plugins.hub.authentication.login:login
    # Project
    - skore.plugins.project.local = skore._plugins.local:Project
    - skore.plugins.project.hub = skore._plugins.hub.project.project:Project
    - skore.plugins.project.mlflow = skore._plugins.mlflow:Project

  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - IPython
    - httpx
    - ipywidgets
    - jinja2
    - joblib
    - matplotlib-base
    - mlflow >=3.0.0
    - narwhals >=2.0.1
    - numpy
    - orjson
    - pandas
    - platformdirs
    - plotly
    - pydantic
    - rich >=14.2
    - scikit-learn
    - scipy
    - seaborn
    - skrub >=0.10
    - skore-cli
    - uuid6 >=2025.0.0

test:
  imports:
    - skore
  commands:
    - conda doctor
  requires:
    - python {{ python_min }}
    - conda

about:
  home: https://github.com/probabl-ai/skore
  summary: the scikit-learn sidekick
  description: |
    Track Your Data Science.
    Skore's open-source Python library accelerates ML model development with automated evaluation reports,
    smart methodological guidance, and comprehensive cross-validation analysis.
  doc_url: https://skore.probabl.ai
  dev_url: https://github.com/probabl-ai/skore
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - auguste-probabl
    - glemaitre
    - jeromedockes
    - thomass-dev
