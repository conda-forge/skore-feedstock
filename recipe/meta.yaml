{% set name = "skore" %}
{% set version = "0.29.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/skore-{{ version }}.tar.gz
  sha256: 7fadc728b55321f20be3b1d85a1fa09ea43e001fc0fd35360f2a1aae68d1cd16

build:
  entry_points:
    # CLI
    - skore = skore._cli:cli
    # Project
    - skore.plugins.project.local = skore._plugins.local:Project
    - skore.plugins.project.hub = skore._plugins.hub.project.project:Project
    - skore.plugins.project.mlflow = skore._plugins.mlflow:Project

  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    # skore
    - click
    - jinja2
    - joblib >=1.4
    - matplotlib-base
    - narwhals >=2.0.1
    - numpy
    - packaging >=24.2
    - pandas
    - plotly
    - rich >=14.2
    - rich-click >=1.9
    - scikit-learn
    - seaborn
    # skore-skills is a hard dependency of the `skore` CLI (skore._cli.skills)
    - skore-skills
    - skrub >=0.10
    - textual
    - uuid6 >=2025.0
    # skore[jupyter]
    - IPython
    # skore[hub]
    - filelock
    - httpx
    - keyring >=25.7
    - orjson
    - pydantic
    - scipy
    # rich[jupyter], pulled in by skore[hub]
    - ipywidgets
    # skore[mlflow]
    - mlflow >=3

test:
  imports:
    - skore
  commands:
    - conda doctor
    - skore --help
  requires:
    - python {{ python_min }}
    - conda

about:
  home: https://github.com/probabl-ai/skore
  summary: the scikit-learn sidekick
  description: |
    Track Your Data Science.
    Skore's open-source Python library accelerates ML model development with automated evaluation reports,
    smart methodological guidance, and comprehensive cross-validation analysis.
  doc_url: https://skore.probabl.ai
  dev_url: https://github.com/probabl-ai/skore
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - auguste-probabl
    - glemaitre
    - jeromedockes
    - thomass-dev
