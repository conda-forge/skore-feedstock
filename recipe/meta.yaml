{% set name = "skore" %}
{% set version = "0.27.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/skore-{{ version }}.tar.gz
  sha256: b4042133d99c912e9435d4625479b61997cc94df0383cc6224a1af7bd975a264

build:
  entry_points:
    # login
    - skore.plugins.login.hub = skore._plugins.hub.authentication.login:login
    # Project
    - skore.plugins.project.local = skore._plugins.local:Project
    - skore.plugins.project.hub = skore._plugins.hub.project.project:Project
    - skore.plugins.project.mlflow = skore._plugins.mlflow:Project

  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    # skore
    - jinja2
    - joblib >=1.4
    - matplotlib-base
    - narwhals >=2.0.1
    - numpy
    - packaging >=24.2
    - pandas
    - plotly
    - rich >=14.2
    - scikit-learn
    - seaborn
    - skrub >=0.10
    - uuid6 >=2025.0
    # skore[jupyter]
    - IPython
    # skore[hub]
    - filelock
    - httpx
    - ipywidgets
    - keyring >=25.7
    - orjson
    - pydantic
    - scipy
    - skore-cli
    # skore[mlflow]
    - mlflow >=3.0

test:
  imports:
    - skore
  commands:
    - conda doctor
  requires:
    - python {{ python_min }}
    - conda

about:
  home: https://github.com/probabl-ai/skore
  summary: the scikit-learn sidekick
  description: |
    Track Your Data Science.
    Skore's open-source Python library accelerates ML model development with automated evaluation reports,
    smart methodological guidance, and comprehensive cross-validation analysis.
  doc_url: https://skore.probabl.ai
  dev_url: https://github.com/probabl-ai/skore
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - auguste-probabl
    - glemaitre
    - jeromedockes
    - thomass-dev
